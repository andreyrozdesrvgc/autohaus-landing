# Конфигурация MongoDB для AUTOHAUS VDS
# Скопируйте: sudo cp /home/autohaus/app/configs/mongod.conf /etc/mongod.conf && sudo systemctl restart mongod

storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
